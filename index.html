<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>LORA - Дизайн. Смело. По-своему.</title>
    <style>
        /* Подключаем элегантные шрифты */
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Manrope:wght@300;400&display=swap');
        
        body {
            margin: 0;
            background-color: #F9F9F7;
            color: #1A1A1A;
            font-family: 'Manrope', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        
        .hero-section {
            max-width: 800px;
            padding: 40px;
        }
        
        .pre-title {
            font-size: 0.75rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 2rem;
            color: #B78015;
        }
        
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            font-weight: 400;
            line-height: 1.2;
            margin: 0 0 1.5rem 0;
        }
        
        h1 em {
            font-style: italic;
            color: #630F15;
        }
        
        .description {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 3rem;
        }
        
        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 4rem;
        }
        
        .btn {
            padding: 14px 28px;
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            text-decoration: none;
            border: 1px solid #1A1A1A;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background-color: #1A1A1A;
            color: #F9F9F7;
        }
        
        .btn-primary:hover {
            background-color: #0E4D3E;
            border-color: #0E4D3E;
        }
        
        .btn-secondary {
            background-color: transparent;
            color: #1A1A1A;
        }
        
        .btn-secondary:hover {
            background-color: #630F15;
            color: #F9F9F7;
            border-color: #630F15;
        }
        
        .portfolio-tags {
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="hero-section">
        <div class="pre-title">Независимый графический дизайн</div>
        <h1>ДИЗАЙН.<br><em>СМЕЛО.</em><br>ПО-СВОЕМУ.</h1>
        <p class="description">Графический дизайн на пересечении<br>моды, культуры и повседневности.</p>
        
        <div class="buttons">
            <a href="https://wa.me/79888082122" class="btn btn-primary">Обсудим вашу идею</a>
            <a href="#work" class="btn btn-secondary">Смотреть работы</a>
        </div>
        
        <div class="portfolio-tags">
            БРЕНД-АЙДЕНТИКА &middot; ГРАФИЧЕСКИЙ ДИЗАЙН &middot; АРТ-ДИРЕКШН
        </div>
    </div>
</body>
</html>
